</body>
</html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Card Credit Card Payoff Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --accent:#2563eb;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}
h1{text-align:center;color:var(--accent);margin:20px}
.container{max-width:1300px;margin:auto;padding:16px}
.grid{
  display:grid;
  grid-template-columns:420px 1fr;
  gap:24px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}
.section{margin-bottom:18px}
.section h3{margin:0 0 10px;color:var(--accent)}
label{font-size:13px;color:var(--muted)}
input,select,button{
  width:100%;
  padding:12px;
  margin-top:6px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #e5e7eb;
}
button{
  background:var(--accent);
  color:#fff;
  font-weight:600;
  cursor:pointer;
}
.secondary{background:#eef2ff;color:#111}
.cards .row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:16px;
}
.box{
  background:#f8fafc;
  padding:14px;
  border-radius:12px;
  text-align:center;
}
.box b{display:block;font-size:18px}
.chart-wrap{
  height:380px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #e5e7eb;
  text-align:right;
}
th{text-align:left;color:#374151}
@media(max-width:1100px){
  .grid{grid-template-columns:1fr}
}
@media(max-width:600px){
  .results{grid-template-columns:repeat(2,1fr)}
  .chart-wrap{height:320px}
}
</style>
</head>

<body>
<h1>💳 Multi-Card Credit Card Payoff Calculator</h1>
<div class="container">
<div class="grid">

<!-- INPUT -->
<div class="card">
<div class="section">
<h3>Monthly Budget</h3>
<label>Total Monthly Payment</label>
<input id="budget" value="500">
</div>

<div class="section">
<h3>Payoff Strategy</h3>
<select id="strategy">
<option value="avalanche">Avalanche (Highest APR)</option>
<option value="snowball">Snowball (Lowest Balance)</option>
</select>
</div>

<div class="section">
<h3>Credit Cards</h3>
<div id="cards" class="cards"></div>
<button class="secondary" onclick="addCard()">+ Add Card</button>
</div>

<button onclick="calculate()">Calculate Payoff</button>
<button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- OUTPUT -->
<div class="card">
<div class="results">
<div class="box"><b id="months">0</b>Months</div>
<div class="box"><b id="interest">$0</b>Interest Paid</div>
<div class="box"><b id="total">$0</b>Total Paid</div>
<div class="box"><b id="saved">$0</b>Interest Saved</div>
</div>

<div class="chart-wrap">
<canvas id="chart"></canvas>
</div>

<h3>Amortization Schedule</h3>
<button class="secondary" onclick="window.print()">Print / Export</button>
<table>
<thead>
<tr>
<th>Month</th>
<th>Payment</th>
<th>Interest</th>
<th>Principal</th>
<th>Balance</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>
</div>

<script>
let chart;
const $=id=>document.getElementById(id);
const money=n=>"$"+Math.round(n).toLocaleString();

function addCard(balance=5000,apr=18.9,min=100){
 const d=document.createElement("div");
 d.className="row";
 d.innerHTML=`
 <input placeholder="Balance" value="${balance}">
 <input placeholder="APR %" value="${apr}">
 <input placeholder="Min Pay" value="${min}">
 `;
 $("cards").appendChild(d);
}

addCard(5000,18.9,100);
addCard(3900,19.99,90);
addCard(6000,15.99,120);

function calculate(){
 let budget=+$("budget").value;
 let strategy=$("strategy").value;
 let rows=[...document.querySelectorAll(".row")].map(r=>{
  let i=r.querySelectorAll("input");
  return{
   bal:+i[0].value,
   apr:+i[1].value/100/12,
   min:+i[2].value,
   interest:0
  };
 });

 let months=0,totalInterest=0,totalPaid=0;
 let labels=[],balances=[],table="";
 while(rows.some(c=>c.bal>0) && months<600){
  months++;
  let remaining=budget;

  rows.forEach(c=>{
   if(c.bal>0){
    let int=c.bal*c.apr;
    c.bal+=int;
    c.interest+=int;
    totalInterest+=int;
   }
  });

  let order=[...rows].filter(c=>c.bal>0)
   .sort((a,b)=>strategy==="avalanche"?b.apr-a.apr:a.bal-b.bal);

  order.forEach(c=>{
   if(remaining<=0||c.bal<=0)return;
   let pay=Math.min(c.min,remaining,c.bal);
   c.bal-=pay;
   remaining-=pay;
   totalPaid+=pay;
  });

  order.forEach(c=>{
   if(remaining<=0||c.bal<=0)return;
   let pay=Math.min(remaining,c.bal);
   c.bal-=pay;
   remaining-=pay;
   totalPaid+=pay;
  });

  let totalBal=rows.reduce((s,c)=>s+c.bal,0);
  labels.push("M"+months);
  balances.push(totalBal);
  table+=`<tr>
   <td>${months}</td>
   <td>${money(budget)}</td>
   <td>${money(totalInterest/ months)}</td>
   <td>${money(budget-(totalInterest/months))}</td>
   <td>${money(totalBal)}</td>
  </tr>`;
 }

 $("months").textContent=months;
 $("interest").textContent=money(totalInterest);
 $("total").textContent=money(totalPaid);
 $("saved").textContent=money(0);
 $("table").innerHTML=table;

 if(chart)chart.destroy();
 chart=new Chart($("chart"),{
  type:"line",
  data:{
   labels,
   datasets:[{
    label:"Remaining Balance",
    data:balances,
    borderColor:"#2563eb",
    tension:.35
   }]
  },
  options:{responsive:true,maintainAspectRatio:false}
 });
}
</script>
</body>
</html>
