<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Card Credit Card Payoff Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#fff;
  --accent:#2563eb;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}
h1{text-align:center;color:var(--accent);margin:20px}
.container{max-width:1250px;margin:auto;padding:16px}
.grid{
  display:grid;
  grid-template-columns:420px 1fr;
  gap:24px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
}
.section{margin-bottom:18px}
.section h3{margin:0 0 12px;color:var(--accent)}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef2ff;margin-top:8px}

.cards-grid{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:8px;
}
.cards-grid input{margin-bottom:6px}

.summary{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:16px;
}
.box{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  text-align:center;
}
.box b{font-size:20px}

.chart-wrap{
  height:340px;
}
.chart-wrap canvas{
  width:100% !important;
  height:100% !important;
}

.table-wrap{
  max-height:420px;
  overflow:auto;
  margin-top:14px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #e5e7eb;
  text-align:right;
}
th{text-align:center;background:#f1f5f9}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .summary{grid-template-columns:repeat(2,1fr)}
  .chart-wrap{height:260px}
}
</style>
</head>

<body>
<h1>💳 Multi-Card Credit Card Payoff Calculator</h1>

<div class="container">
<div class="grid">

<!-- INPUT -->
<div class="card">

<div class="section">
<h3>Monthly Budget</h3>
<label>Total Monthly Payment</label>
<input id="budget" value="500">
</div>

<div class="section">
<h3>Payoff Strategy</h3>
<select id="strategy">
<option value="avalanche">Avalanche (Highest APR)</option>
<option value="snowball">Snowball (Lowest Balance)</option>
</select>
</div>

<div class="section">
<h3>Credit Cards</h3>
<div id="cards"></div>
<button class="secondary" onclick="addCard()">+ Add Card</button>
</div>

<button class="primary" onclick="calculate()">Calculate Payoff</button>
<button class="secondary" onclick="resetAll()">Reset</button>

</div>

<!-- OUTPUT -->
<div class="card">

<div class="summary">
<div class="box"><b id="months">0</b><div>Months</div></div>
<div class="box"><b id="interest">$0</b><div>Interest Paid</div></div>
<div class="box"><b id="total">$0</b><div>Total Paid</div></div>
<div class="box"><b id="saved">$0</b><div>Interest Saved</div></div>
</div>

<div class="chart-wrap">
<canvas id="chart"></canvas>
</div>

<h3>Amortization Schedule</h3>
<button class="secondary" onclick="printTable()">Print / Export</button>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Month</th><th>Payment</th><th>Interest</th><th>Principal</th><th>Balance</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>

</div>
</div>

<script>
let chart;

function addCard(balance=5000, apr=18.9, min=100){
 const div=document.createElement("div");
 div.className="cards-grid";
 div.innerHTML=`
 <input placeholder="Balance" value="${balance}">
 <input placeholder="APR %" value="${apr}">
 <input placeholder="Min Payment" value="${min}">
 `;
 document.getElementById("cards").appendChild(div);
}

function resetAll(){location.reload()}

addCard(5000,18.9,100);
addCard(3900,19.99,90);
addCard(6000,15.99,120);

function money(n){return "$"+Math.round(n).toLocaleString()}

function calculate(){
 const budget=+document.getElementById("budget").value;
 const strategy=document.getElementById("strategy").value;
 const rows=[...document.querySelectorAll(".cards-grid")].map(r=>{
  const i=r.querySelectorAll("input");
  return{
   bal:+i[0].value,
   apr:+i[1].value/100/12,
   min:+i[2].value
  }
 });

 let cards=rows.map(c=>({...c}));
 let month=0, totalInt=0, totalPay=0;
 let chartData=[], labels=[];
 let table=document.getElementById("table");
 table.innerHTML="";

 while(cards.some(c=>c.bal>0) && month<600){
  month++;
  let paymentLeft=budget;
  let interestMonth=0;
  
  cards.forEach(c=>{
   if(c.bal<=0) return;
   const i=c.bal*c.apr;
   interestMonth+=i;
   totalInt+=i;
   c.bal+=i;
  });

  let ordered=[...cards].filter(c=>c.bal>0);
  ordered.sort((a,b)=>strategy==="avalanche"?b.apr-a.apr:a.bal-b.bal);

  ordered.forEach(c=>{
   if(paymentLeft<=0) return;
   const pay=Math.max(c.min, Math.min(c.bal,paymentLeft));
   c.bal-=pay;
   paymentLeft-=pay;
   totalPay+=pay;
  });

  const totalBal=cards.reduce((s,c)=>s+Math.max(0,c.bal),0);
  chartData.push(totalBal);
  labels.push("M"+month);

  table.innerHTML+=`
   <tr>
    <td>${month}</td>
    <td>${money(budget)}</td>
    <td>${money(interestMonth)}</td>
    <td>${money(budget-interestMonth)}</td>
    <td>${money(totalBal)}</td>
   </tr>`;
 }

 document.getElementById("months").textContent=month;
 document.getElementById("interest").textContent=money(totalInt);
 document.getElementById("total").textContent=money(totalPay);
 document.getElementById("saved").textContent=money(0);

 if(chart) chart.destroy();
 chart=new Chart(document.getElementById("chart"),{
  type:"line",
  data:{labels,datasets:[{
   label:"Remaining Balance",
   data:chartData,
   borderColor:"#2563eb",
   tension:.35
  }]},
  options:{
   responsive:true,
   maintainAspectRatio:false
  }
 });
}

function printTable(){window.print()}
calculate();
</script>
</body>
</html>
