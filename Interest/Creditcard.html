<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Card Credit Card Payoff Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --accent:#2563eb;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
}
h1{
  text-align:center;
  color:var(--accent);
  margin:24px 0;
}
.container{
  max-width:1300px;
  margin:auto;
  padding:16px;
}
.grid{
  display:grid;
  grid-template-columns:420px 1fr;
  gap:24px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px;
}
.section{
  margin-bottom:22px;
}
.section h3{
  margin:0 0 10px;
  color:var(--accent);
}
label{
  font-size:13px;
  color:var(--muted);
  display:block;
  margin-bottom:6px;
}
input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1.5px solid #e5e7eb;
  margin-bottom:14px;
}
.card-row{
  display:grid;
  grid-template-columns:1.2fr 1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef2ff;color:#111;margin-top:10px}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}
.stat{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  text-align:center;
}
.stat b{font-size:20px}
.stat span{font-size:12px;color:var(--muted)}

.chart-wrap{
  height:360px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px;
}
th,td{
  padding:10px;
  border-bottom:1px solid #e5e7eb;
  text-align:right;
}
th{text-align:left}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .chart-wrap{height:420px}
}
</style>
</head>

<body>
<h1>💳 Multi-Card Credit Card Payoff Calculator</h1>

<div class="container">
<div class="grid">

<!-- INPUT -->
<div class="card">

<div class="section">
<h3>Monthly Budget</h3>
<label>Total Monthly Budget (for all cards)</label>
<input id="budget" value="500">
</div>

<div class="section">
<h3>Payoff Strategy</h3>
<select id="strategy">
<option value="avalanche">Avalanche – Highest APR First</option>
<option value="snowball">Snowball – Lowest Balance First</option>
</select>
</div>

<div class="section">
<h3>Credit Cards</h3>

<div class="card-row">
<input placeholder="Balance ($)" class="bal" value="5000">
<input placeholder="APR (%)" class="apr" value="18.9">
<input placeholder="Min Payment ($)" class="min" value="100">
</div>

<div class="card-row">
<input placeholder="Balance ($)" class="bal" value="3900">
<input placeholder="APR (%)" class="apr" value="19.99">
<input placeholder="Min Payment ($)" class="min" value="90">
</div>

<div class="card-row">
<input placeholder="Balance ($)" class="bal" value="6000">
<input placeholder="APR (%)" class="apr" value="15.99">
<input placeholder="Min Payment ($)" class="min" value="120">
</div>

</div>

<button class="primary" onclick="calculate()">Calculate Payoff</button>
<button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- OUTPUT -->
<div class="card">

<div class="stats">
<div class="stat"><b id="months">0</b><span>Months</span></div>
<div class="stat"><b id="interest">$0</b><span>Interest Paid</span></div>
<div class="stat"><b id="total">$0</b><span>Total Paid</span></div>
<div class="stat"><b id="balance">$0</b><span>Remaining Balance</span></div>
</div>

<div class="chart-wrap">
<canvas id="chart"></canvas>
</div>

<h3>Amortization Schedule (All Cards Combined)</h3>
<button class="secondary" onclick="window.print()">Print / Export</button>

<table>
<thead>
<tr>
<th>Month</th>
<th>Payment</th>
<th>Interest</th>
<th>Principal</th>
<th>Balance</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

</div>
</div>

<script>
let chart;

function money(n){return "$"+Math.round(n).toLocaleString()}

function calculate(){
 const balances=[...document.querySelectorAll(".bal")].map(i=>+i.value);
 const aprs=[...document.querySelectorAll(".apr")].map(i=>+i.value/100/12);
 const mins=[...document.querySelectorAll(".min")].map(i=>+i.value);
 const budget=+document.getElementById("budget").value;
 const strategy=document.getElementById("strategy").value;

 let cards=balances.map((b,i)=>({bal:b,apr:aprs[i],min:mins[i]}))
 .filter(c=>c.bal>0);

 let month=0,totalInterest=0,totalPaid=0;
 let labels=[],balancesData=[];
 const tbody=document.getElementById("table");
 tbody.innerHTML="";

 while(cards.some(c=>c.bal>0)){
  month++;
  let interest=0,principal=0;
  let remaining=budget;

  cards.forEach(c=>{
    let i=c.bal*c.apr;
    interest+=i;
    c.bal+=i;
  });

  cards.forEach(c=>{
    let p=Math.min(c.min,c.bal,remaining);
    c.bal-=p;
    remaining-=p;
    principal+=p;
  });

  cards.sort((a,b)=>{
    return strategy==="avalanche"?b.apr-a.apr:a.bal-b.bal;
  });

  for(let c of cards){
    if(remaining<=0) break;
    let p=Math.min(c.bal,remaining);
    c.bal-=p;
    remaining-=p;
    principal+=p;
  }

  let balSum=cards.reduce((s,c)=>s+c.bal,0);
  totalInterest+=interest;
  totalPaid+=principal;

  labels.push("M"+month);
  balancesData.push(balSum);

  tbody.innerHTML+=`
   <tr>
    <td>${month}</td>
    <td>${money(principal)}</td>
    <td>${money(interest)}</td>
    <td>${money(principal-interest)}</td>
    <td>${money(balSum)}</td>
   </tr>`;
 }

 document.getElementById("months").textContent=month;
 document.getElementById("interest").textContent=money(totalInterest);
 document.getElementById("total").textContent=money(totalPaid);
 document.getElementById("balance").textContent="$0";

 if(chart) chart.destroy();
 chart=new Chart(document.getElementById("chart"),{
  type:"line",
  data:{labels,datasets:[{
    label:"Remaining Balance",
    data:balancesData,
    borderColor:"#2563eb",
    tension:.3
  }]},
  options:{maintainAspectRatio:false}
 });
}

calculate();
</script>
</body>
</html>
