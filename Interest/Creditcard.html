<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Card Credit Card Payoff Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --primary:#2563eb;
  --text:#0f172a;
  --muted:#64748b;
  --border:#e5e7eb;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
h1{
  text-align:center;
  margin:22px 0;
  color:var(--primary);
}
.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}
.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:24px;
  align-items:stretch;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:22px;
  display:flex;
  flex-direction:column;
}
.section{
  margin-bottom:18px;
}
.section h3{
  margin:0 0 10px;
  color:var(--primary);
  font-size:16px;
}
label{
  font-size:12px;
  color:var(--muted);
  display:block;
  margin-bottom:4px;
}
input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:14px;
}
button{
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}
.primary{background:var(--primary);color:#fff}
.secondary{background:#eef2ff;margin-top:10px}

.card-row{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}
.card-row h4{
  margin:0 0 10px;
  font-size:14px;
}
.card-grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:16px;
}
.result-box{
  background:#f8fafc;
  border-radius:12px;
  padding:14px;
  text-align:center;
}
.result-box b{
  font-size:18px;
  display:block;
}
.result-box small{
  font-size:12px;
  color:var(--muted);
}

.chart-wrap{
  height:260px;
}

.table-wrap{
  margin-top:14px;
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
  flex:1;
}
.table-wrap table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
.table-wrap thead{
  background:#f1f5f9;
  position:sticky;
  top:0;
}
.table-wrap th,
.table-wrap td{
  padding:8px;
  border-bottom:1px solid var(--border);
  text-align:right;
}
.table-wrap th:first-child,
.table-wrap td:first-child{
  text-align:center;
}
.table-body{
  max-height:380px;
  overflow:auto;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,1fr)}
  .chart-wrap{height:220px}
}
</style>
</head>

<body>
<h1>💳 Multi-Card Credit Card Payoff Calculator</h1>

<div class="container">
<div class="grid">

<!-- LEFT -->
<div class="card">
<div class="section">
<h3>Monthly Budget</h3>
<label>Total amount you can pay each month across all cards</label>
<input id="budget" value="500">
</div>

<div class="section">
<h3>Payoff Strategy</h3>
<label>Avalanche = highest APR first • Snowball = smallest balance first</label>
<select id="strategy">
  <option value="avalanche">Avalanche (Highest APR)</option>
  <option value="snowball">Snowball (Smallest Balance)</option>
</select>
</div>

<div class="section">
<h3>Credit Cards</h3>

<div class="card-row">
<h4>Card 1</h4>
<div class="card-grid">
  <div>
    <label>Balance</label>
    <input class="bal" value="5000">
  </div>
  <div>
    <label>APR (%)</label>
    <input class="apr" value="18.9">
  </div>
  <div>
    <label>Minimum</label>
    <input class="min" value="100">
  </div>
</div>
</div>

<div class="card-row">
<h4>Card 2</h4>
<div class="card-grid">
  <div>
    <label>Balance</label>
    <input class="bal" value="3900">
  </div>
  <div>
    <label>APR (%)</label>
    <input class="apr" value="19.99">
  </div>
  <div>
    <label>Minimum</label>
    <input class="min" value="90">
  </div>
</div>
</div>

<div class="card-row">
<h4>Card 3</h4>
<div class="card-grid">
  <div>
    <label>Balance</label>
    <input class="bal" value="6000">
  </div>
  <div>
    <label>APR (%)</label>
    <input class="apr" value="15.99">
  </div>
  <div>
    <label>Minimum</label>
    <input class="min" value="120">
  </div>
</div>
</div>

</div>

<button class="primary" onclick="calculate()">Calculate Payoff</button>
<button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- RIGHT -->
<div class="card">
<div class="results">
  <div class="result-box"><b id="rMonths">–</b><small>Months</small></div>
  <div class="result-box"><b id="rInterest">–</b><small>Interest Paid</small></div>
  <div class="result-box"><b id="rTotal">–</b><small>Total Paid</small></div>
  <div class="result-box"><b id="rRemain">–</b><small>Remaining</small></div>
</div>

<div class="chart-wrap">
<canvas id="chart"></canvas>
</div>

<h3 style="margin:12px 0">Amortization Schedule (All Cards Combined)</h3>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Month</th>
<th>Payment</th>
<th>Interest</th>
<th>Principal</th>
<th>Balance</th>
</tr>
</thead>
<tbody class="table-body" id="table"></tbody>
</table>
</div>

</div>

</div>
</div>

<script>
let chart;

function money(n){return "$"+n.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,",");}

function calculate(){
const budget=+document.getElementById("budget").value;
const strategy=document.getElementById("strategy").value;

let cards=[...document.querySelectorAll(".card-row")].map(c=>({
  bal:+c.querySelector(".bal").value,
  apr:+c.querySelector(".apr").value/100/12,
  min:+c.querySelector(".min").value
}));

let month=0,totalInterest=0,totalPaid=0;
let rows=[],balances=[];

while(cards.some(c=>c.bal>0) && month<600){
  month++;
  let paymentLeft=budget;
  let interestMonth=0;

  cards.forEach(c=>{
    if(c.bal>0){
      let i=c.bal*c.apr;
      interestMonth+=i;
      c.bal+=i;
    }
  });

  let order=[...cards].filter(c=>c.bal>0)
    .sort((a,b)=>strategy==="avalanche"?b.apr-a.apr:a.bal-b.bal);

  order.forEach(c=>{
    if(paymentLeft>0 && c.bal>0){
      let pay=Math.min(Math.max(c.min,paymentLeft),c.bal);
      c.bal-=pay;
      paymentLeft-=pay;
      totalPaid+=pay;
    }
  });

  totalInterest+=interestMonth;
  balances.push(cards.reduce((s,c)=>s+c.bal,0));

  rows.push(`
    <tr>
      <td>${month}</td>
      <td>${money(budget)}</td>
      <td>${money(interestMonth)}</td>
      <td>${money(budget-interestMonth)}</td>
      <td>${money(balances.at(-1))}</td>
    </tr>
  `);
}

document.getElementById("rMonths").textContent=month;
document.getElementById("rInterest").textContent=money(totalInterest);
document.getElementById("rTotal").textContent=money(totalPaid);
document.getElementById("rRemain").textContent=money(0);
document.getElementById("table").innerHTML=rows.join("");

if(chart)chart.destroy();
chart=new Chart(document.getElementById("chart"),{
  type:"line",
  data:{
    labels:balances.map((_,i)=>"M"+(i+1)),
    datasets:[{
      label:"Remaining Balance",
      data:balances,
      borderColor:"#2563eb",
      tension:.3
    }]
  },
  options:{responsive:true,maintainAspectRatio:false}
});
}

calculate();
</script>
</body>
</html>
