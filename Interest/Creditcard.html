<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Credit Card Payoff Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --accent:#2f6ce5;
  --success:#10b981;
  --danger:#ef4444;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
}
h1{
  text-align:center;
  color:var(--accent);
  margin:24px 0;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}
.grid{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:24px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:24px;
}
.section{
  margin-bottom:20px;
  padding-bottom:16px;
  border-bottom:1px solid #eef2f7;
}
.section:last-child{border:none}
.section h3{
  margin:0 0 14px;
  color:var(--accent);
}
label{
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
  display:block;
}
input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1.8px solid #e5e7eb;
  margin-bottom:14px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef2ff;color:#111;margin-top:10px}

.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:20px;
}
.result-box{
  background:#f8fafc;
  border-radius:12px;
  padding:16px;
  text-align:center;
}
.result-box b{font-size:20px;display:block}
.result-box small{color:var(--muted);font-size:12px}

.chart-wrap{height:340px;margin-bottom:20px}

table{
  width:100%;
  border-collapse:collapse;
  font-size:13px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #e5e7eb;
  text-align:right;
}
th{text-align:left;color:#374151}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,1fr)}
  .chart-wrap{height:260px}
}
</style>
</head>

<body>
<h1>💳 Credit Card Payoff Calculator</h1>

<div class="container">
<div class="grid">

<!-- INPUT -->
<div class="card">

<div class="section">
<h3>Card Details</h3>
<label>Currency</label>
<select id="currency">
<option value="$">$ USD</option>
<option value="€">€ EUR</option>
<option value="£">£ GBP</option>
<option value="₹">₹ INR</option>
</select>

<label>Current Balance</label>
<input id="balance" value="5000">

<label>APR (%)</label>
<input id="apr" value="18.9">
</div>

<div class="section">
<h3>Payment Setup</h3>
<label>Payment Type</label>
<select id="ptype">
<option value="fixed">Fixed Monthly Payment</option>
<option value="minimum">Minimum % Payment</option>
</select>

<label>Monthly Payment</label>
<input id="payment" value="250">

<label>Minimum Payment (%)</label>
<input id="minpct" value="2">
</div>

<div class="section">
<h3>Extra Options</h3>
<label>Extra Monthly Payment</label>
<input id="extra" value="50">

<label>One-Time Lump Sum</label>
<input id="lump" value="1000">

<label>Balance Transfer APR (%)</label>
<input id="btapr" value="0">

<label>Balance Transfer Fee (%)</label>
<input id="btfee" value="3">
</div>

<button class="primary" onclick="calculate()">Calculate Payoff</button>
<button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- OUTPUT -->
<div class="card">

<div class="results">
<div class="result-box"><b id="rMonths">0</b><small>Months</small></div>
<div class="result-box"><b id="rInterest">$0</b><small>Interest Paid</small></div>
<div class="result-box"><b id="rTotal">$0</b><small>Total Paid</small></div>
<div class="result-box"><b id="rSaved">$0</b><small>Interest Saved</small></div>
</div>

<div class="chart-wrap">
<canvas id="chart"></canvas>
</div>

<h3>Amortization Schedule</h3>
<table>
<thead>
<tr>
<th>Month</th>
<th>Payment</th>
<th>Interest</th>
<th>Principal</th>
<th>Balance</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

</div>

</div>
</div>

<script>
let chart;

function calculate(){
 const cur=document.getElementById("currency").value;
 let bal=+balance.value;
 let apr=+aprInput();
 let payment=+document.getElementById("payment").value;
 let minPct=+minpct.value/100;
 let extra=+document.getElementById("extra").value;
 let lump=+document.getElementById("lump").value;
 let btAPR=+btapr.value/100;
 let btFee=+btfee.value/100;
 let type=ptype.value;

 let monthlyRate=apr/100/12;
 let month=0,totalPaid=0,totalInterest=0;
 let labels=[],balances=[],interests=[];
 table.innerHTML="";

 if(btAPR>0){
  bal+=bal*btFee;
  monthlyRate=btAPR/12;
 }

 if(lump>0){ bal=Math.max(0,bal-lump); totalPaid+=lump }

 while(bal>0 && month<600){
  month++;
  let interest=bal*monthlyRate;
  let pay=(type==="fixed")?payment:Math.max(bal*minPct,25);
  pay+=extra;
  if(pay>bal+interest) pay=bal+interest;

  let principal=pay-interest;
  bal=Math.max(0,bal-principal);

  totalPaid+=pay;
  totalInterest+=interest;

  labels.push("M"+month);
  balances.push(bal);
  interests.push(totalInterest);

  table.innerHTML+=`
   <tr>
    <td>${month}</td>
    <td>${cur}${pay.toFixed(0)}</td>
    <td>${cur}${interest.toFixed(0)}</td>
    <td>${cur}${principal.toFixed(0)}</td>
    <td>${cur}${bal.toFixed(0)}</td>
   </tr>`;
 }

 rMonths.textContent=month;
 rInterest.textContent=cur+totalInterest.toFixed(0);
 rTotal.textContent=cur+totalPaid.toFixed(0);
 rSaved.textContent=cur+(balances.length?interests[interests.length-1]-totalInterest:0);

 if(chart) chart.destroy();
 chart=new Chart(document.getElementById("chart"),{
  type:"line",
  data:{
   labels,
   datasets:[
    {label:"Remaining Balance",data:balances,borderColor:"#2563eb",tension:.3},
    {label:"Interest Paid",data:interests,borderColor:"#ef4444",tension:.3}
   ]
  },
  options:{
   responsive:true,
   maintainAspectRatio:false,
   scales:{y:{beginAtZero:true}}
  }
 });
}

function aprInput(){ return document.getElementById("apr").value }
calculate();
</script>
</body>
</html>
