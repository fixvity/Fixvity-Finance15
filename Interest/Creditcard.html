<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Card Credit Card Payoff Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f5f7fb;
  --card:#ffffff;
  --accent:#2f6ce5;
  --danger:#ef4444;
  --success:#10b981;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}
h1{
  text-align:center;
  color:var(--accent);
  margin:20px 0;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}
.grid{
  display:grid;
  grid-template-columns:420px 1fr;
  gap:24px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}
.section{
  border-bottom:1px solid #eef2f7;
  margin-bottom:16px;
  padding-bottom:16px;
}
.section:last-child{border:none}
.section h3{
  margin:0 0 12px;
  color:var(--accent);
}
label{
  font-size:13px;
  color:var(--muted);
}
input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1.6px solid #e5e7eb;
  margin:6px 0 12px;
}
button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}
.primary{background:var(--accent);color:#fff}
.secondary{background:#eef2ff;margin-top:10px}

.results{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}
.box{
  background:#f8fafc;
  padding:14px;
  border-radius:12px;
  text-align:center;
}
.box b{font-size:18px;display:block}

.chart-wrap{
  height:320px;
  margin-top:16px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:16px;
}
th,td{
  padding:8px;
  border-bottom:1px solid #e5e7eb;
  text-align:right;
  font-size:13px;
}
th{text-align:left}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
  .results{grid-template-columns:repeat(2,1fr)}
  .chart-wrap{height:240px}
}
</style>
</head>

<body>
<h1>💳 Multi-Card Credit Card Payoff Calculator</h1>

<div class="container">
<div class="grid">

<!-- INPUT -->
<div class="card">
<div class="section">
<h3>Monthly Budget</h3>
<label>Total Monthly Payment ($)</label>
<input id="budget" value="500">
</div>

<div class="section">
<h3>Credit Cards</h3>

<div id="cards"></div>

<button onclick="addCard()">+ Add Card</button>
</div>

<button class="primary" onclick="calculate()">Calculate Payoff</button>
<button class="secondary" onclick="location.reload()">Reset</button>
</div>

<!-- OUTPUT -->
<div class="card">

<div class="results">
<div class="box"><b id="months">0</b><small>Months</small></div>
<div class="box"><b id="interest">$0</b><small>Interest Paid</small></div>
<div class="box"><b id="total">$0</b><small>Total Paid</small></div>
<div class="box"><b id="saved">$0</b><small>Interest Saved</small></div>
</div>

<div class="chart-wrap">
<canvas id="chart"></canvas>
</div>

<h3>Amortization Schedule</h3>
<div style="max-height:420px;overflow:auto">
<table>
<thead>
<tr>
<th>Month</th>
<th>Payment</th>
<th>Interest</th>
<th>Principal</th>
<th>Balance</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>
</div>
</div>

<script>
let chart;
const cardsDiv = document.getElementById("cards");

function addCard(balance=5000, apr=18.9, min=100){
  const d=document.createElement("div");
  d.innerHTML=`
    <label>Balance</label><input class="bal" value="${balance}">
    <label>APR (%)</label><input class="apr" value="${apr}">
    <label>Min Payment</label><input class="min" value="${min}">
    <hr>`;
  cardsDiv.appendChild(d);
}

addCard();addCard(3900,19.99,90);addCard(6000,15.99,120);

const money=n=>"$"+Math.round(n).toLocaleString();

function calculate(){
let budget=+document.getElementById("budget").value;
let cards=[...document.querySelectorAll(".bal")].map((_,i)=>({
 balance:+document.querySelectorAll(".bal")[i].value,
 apr:+document.querySelectorAll(".apr")[i].value/100/12,
 min:+document.querySelectorAll(".min")[i].value
}));

let month=0,totalInterest=0,totalPaid=0;
let balances=[],labels=[],table=document.getElementById("table");
table.innerHTML="";

while(cards.some(c=>c.balance>0)&&month<600){
 month++;
 let payment=0,interest=0,principal=0;

 // sort by highest APR (avalanche)
 cards.sort((a,b)=>b.apr-a.apr);

 let remaining=budget;

 for(let c of cards){
  if(c.balance<=0) continue;
  let i=c.balance*c.apr;
  interest+=i;
  let pay=Math.min(c.min,remaining,c.balance+i);
  c.balance+=i-pay;
  remaining-=pay;
  payment+=pay;
 }

 for(let c of cards){
  if(remaining<=0||c.balance<=0) continue;
  let extra=Math.min(remaining,c.balance);
  c.balance-=extra;
  remaining-=extra;
  payment+=extra;
 }

 principal=payment-interest;
 totalInterest+=interest;
 totalPaid+=payment;

 let totalBal=cards.reduce((s,c)=>s+Math.max(0,c.balance),0);

 table.innerHTML+=`
 <tr>
 <td>${month}</td>
 <td>${money(payment)}</td>
 <td>${money(interest)}</td>
 <td>${money(principal)}</td>
 <td>${money(totalBal)}</td>
 </tr>`;

 balances.push(totalBal);
 labels.push("M"+month);
}

document.getElementById("months").textContent=month;
document.getElementById("interest").textContent=money(totalInterest);
document.getElementById("total").textContent=money(totalPaid);
document.getElementById("saved").textContent=money(0);

if(chart)chart.destroy();
chart=new Chart(document.getElementById("chart"),{
 type:"line",
 data:{
  labels,
  datasets:[{
   label:"Remaining Balance",
   data:balances,
   borderColor:"#2f6ce5",
   tension:.3
  }]
 }
});
}
</script>
</body>
</html>
